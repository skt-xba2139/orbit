<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -3 113 34" role="img" aria-label="ORBIT">
  <title>ORBIT</title>
  <!-- © 2026 Cikgu Rizwan Yusop. Hak cipta terpelihara. -->
  <metadata>© 2026 Cikgu Rizwan Yusop. Hak cipta terpelihara.</metadata>
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="-2" y1="0" x2="107" y2="0">
      <stop offset="0" stop-color="#5ee7ff"/>
      <stop offset=".55" stop-color="#8b7bff"/>
      <stop offset="1" stop-color="#ff6bd6"/>
    </linearGradient>
    <!-- sabit depan orbit: dari biru ke putih (kilau) ke merah jambu -->
    <linearGradient id="c" gradientUnits="userSpaceOnUse" x1="-15.5" y1="0" x2="15.5" y2="0">
      <stop offset="0" stop-color="#5ee7ff"/>
      <stop offset=".3" stop-color="#9bf0ff"/>
      <stop offset=".5" stop-color="#fff"/>
      <stop offset=".7" stop-color="#ffa3e6"/>
      <stop offset="1" stop-color="#ff6bd6"/>
    </linearGradient>
    <linearGradient id="t" gradientUnits="userSpaceOnUse" x1="5.3" y1="-5.3" x2="15.5" y2="0">
      <stop offset="0" stop-color="#ff6bd6" stop-opacity="0"/>
      <stop offset="1" stop-color="#ff6bd6"/>
    </linearGradient>
    <radialGradient id="h">
      <stop offset="0" stop-color="#ff6bd6" stop-opacity=".85"/>
      <stop offset=".45" stop-color="#ff6bd6" stop-opacity=".3"/>
      <stop offset="1" stop-color="#ff6bd6" stop-opacity="0"/>
    </radialGradient>
    <!-- garis luar gelap hanya di kawasan cincin-O, supaya sabit depan nampak melintasi di hadapannya -->
    <clipPath id="r"><path clip-rule="evenodd" d="M26 14A12 12 0 1 0 2 14A12 12 0 1 0 26 14ZM22.4 14A8.4 8.4 0 1 1 5.6 14A8.4 8.4 0 1 1 22.4 14Z"/></clipPath>
  </defs>
  <!-- separuh orbit di belakang cincin-O -->
  <g transform="translate(14 14) rotate(-26)">
    <path d="M-15.5 0A15.5 5.6 0 0 1 15.5 0" fill="none" stroke="url(#g)" stroke-width="1.1" opacity=".5"/>
  </g>
  <g fill="none" stroke="url(#g)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="14" cy="14" r="10.2"/>
    <path d="M37 4v20"/><path d="M37 4h8a5.4 5.4 0 0 1 0 10.8h-8"/><path d="M44.5 14.8L51.5 24"/>
    <path d="M60 4v20"/><path d="M60 4h7.2a4.6 4.6 0 0 1 0 9.2H60"/><path d="M60 13.2h8.2a5.4 5.4 0 0 1 0 10.8H60"/>
    <path d="M82 4v20"/>
    <path d="M89 4h16"/><path d="M97 4v20"/>
  </g>
  <!-- separuh orbit di hadapan cincin-O, dengan titik bercahaya -->
  <g clip-path="url(#r)"><g transform="translate(14 14) rotate(-26)">
    <path d="M15.5 0A15.5 5.6 0 0 1 -15.5 0Q0 8.4 15.5 0Z" fill="none" stroke="#070914" stroke-width="1.2" stroke-linejoin="round"/>
  </g></g>
  <g transform="translate(14 14) rotate(-26)">
    <path d="M15.5 0A15.5 5.6 0 0 1 -15.5 0Q0 8.4 15.5 0Z" fill="url(#c)"/>
    <path d="M5.3 -5.3A15.5 5.6 0 0 1 15.5 0" fill="none" stroke="url(#t)" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="15.5" cy="0" r="5.6" fill="url(#h)"/>
    <circle cx="15.5" cy="0" r="2.8" fill="#ff6bd6"/>
    <circle cx="15.5" cy="0" r="1.15" fill="#fff"/>
  </g>
</svg>
